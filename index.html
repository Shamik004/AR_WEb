<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to AR Drawing App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
        text-align: center;
      }
      .container {
        width: 80%;
        max-width: 800px;
      }
      h1 {
        color: #333;
      }
      p {
        color: #555;
        line-height: 1.6;
      }
      .button {
        display: inline-block;
        margin: 10px;
        padding: 10px 20px;
        font-size: 16px;
        color: #fff;
        background-color: #007bff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        text-decoration: none;
      }
      .button-container {
        text-align: center;
        margin-top: 20px;
      }
      .button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome to the AR Drawing App!</h1>
      <p>
        This application allows you to draw in the air using hand gestures.
        Explore and have fun with the AR drawing capabilities!
      </p>
      <div class="button-container">
        <a href="data.html" class="button">Data Collection</a>
        <a href="instructions.html" class="button">Instructions</a>
        <a href="fun.html" class="button">For Fun Drawings</a>
      </div>
    </div>
  </body>
</html>
